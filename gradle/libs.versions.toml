[versions]
agp = "8.9.2"
kotlin = "2.4.20"
miuix = "0.9.3"
# Kyant0/AndroidLiquidGlass（发布名 backdrop）：底栏的模糊渲染换用它。
# miuix-blur 的模糊在边缘/降采样上有渲染问题，backdrop 的 RenderEffect 链质量更好。
# 钉 2.0.0：2.0.1 会把 Compose 抬到 1.12.0，而 androidx Compose 1.12.0 要求 AGP ≥ 9.1（本项目 8.9.2）。
# 两版源码一致，只差 Compose 依赖。
backdrop = "2.0.0"
coreKtx = "1.13.1"
# 1.13.0 是第一个让 ComponentActivity 实现 NavigationEventDispatcherOwner 的版本：
# Miuix 0.9.3 的 SearchBar / OverlayDialog / 下拉弹窗内部都调用 NavigationBackHandler，
# 缺这个 owner 会直接抛 IllegalStateException（日志页、设置页因此打不开）
activityCompose = "1.13.0"
lifecycle = "2.8.7"

[libraries]
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix" }
# 液态玻璃底栏的渲染：AAR minSdk 21，不需要 overrideLibrary
kyant-backdrop = { group = "io.github.kyant0", name = "backdrop-android", version.ref = "backdrop" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
