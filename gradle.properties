# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# AndroidX 包名结构与「每个库的 R 类只含自己的资源」
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 为 Compose / R8 留出足够的内存
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# 配置缓存：第二次之后的构建直接复用上个构建算好的任务图，跳过整个配置阶段
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# 说明：升级到 AGP 9.4.1 + compileSdk 37 之后，原来那行
#   android.experimental.disableCompileSdkChecks=true
# 不再需要（Miuix 0.9.4 的 AAR 元数据要求 compileSdk >= 37，现在满足）。
# Android SDK 路径写在 local.properties（sdk.dir=/opt/android-sdk）：容器里 ANDROID_HOME
# 只在 login shell 的 /etc/profile.d/android-dev.sh 里设置，非交互构建进程读不到。

# 容器环境的 aapt2 兼容处理：
# 本容器是 aarch64，无法运行 AGP 从 Maven 下载的 x86_64 aapt2，所以 ~/.gradle/gradle.properties 用
# android.aapt2FromMavenOverride 指向 build-tools 36.0.0 的系统 aapt2。在这套组合下，
# AGP 9.4.1 的 optimizeReleaseResources（资源精简管道里的 aapt2 optimize 步骤）会「成功但产出 0 个文件」，
# 于是 packageRelease 打出**没有 AndroidManifest.xml / resources.arsc** 的 release APK（badging 报
# could not identify format of APK）。关掉资源优化即可产出正常 release 包，代价是包体略大。
# 在 x86_64 + 官方 aapt2 环境下可删掉这一行以恢复资源优化。
android.enableResourceOptimizations=false
