distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 与参考工程一致：Gradle 9.7.1（AGP 9.4.1 要求 Gradle 9.x）。
# 用官方源是为了命中容器里已缓存的发行版（~/.gradle/wrapper/dists/gradle-9.7.1-bin）。
