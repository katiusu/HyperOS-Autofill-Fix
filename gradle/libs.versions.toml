[versions]
# 与参考工程 MiuixGuiExample 对齐：AGP 9.4.1 内置 Kotlin 支持，Miuix 0.9.4 的 AAR 元数据
# 要求依赖方 compileSdk >= 37（见 app/build.gradle.kts 里的说明）。
agp = "9.4.1"
kotlin = "2.4.20"
miuix = "0.9.4"
composeBom = "2026.09.00"
# 顶栏/底栏的渐变模糊（BlurredBar 的 hazeEffect）
haze = "1.7.3"
# 仅 StatusIcons.kt 手写路径用的 materialIcon/materialPath 来自这里；
# 不要换成 material-icons-extended（为几个图标会让包体涨好几 MB）。
materialIcons = "1.7.8"
coreKtx = "1.19.1"
# 1.13.0 是第一个让 ComponentActivity 实现 NavigationEventDispatcherOwner 的版本：
# Miuix 的 SearchBar / OverlayDialog / 下拉弹窗内部都调用 NavigationBackHandler，
# 缺这个 owner 会直接抛 IllegalStateException（日志页、设置页因此打不开）
activityCompose = "1.13.0"
lifecycleRuntimeKtx = "2.11.0"

[libraries]
miuix-core = { group = "top.yukonga.miuix.kmp", name = "miuix-core-android", version.ref = "miuix" }
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
miuix-shader = { group = "top.yukonga.miuix.kmp", name = "miuix-shader-android", version.ref = "miuix" }
# 液态玻璃底栏的 backdrop 捕获 + textureBlur（API < 33 由代码降级为不透明底栏）
miuix-blur = { group = "top.yukonga.miuix.kmp", name = "miuix-blur-android", version.ref = "miuix" }
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix" }
miuix-squircle = { group = "top.yukonga.miuix.kmp", name = "miuix-squircle-android", version.ref = "miuix" }
miuix-nav = { group = "top.yukonga.miuix.kmp", name = "miuix-nav-android", version.ref = "miuix" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }

material-icons = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "materialIcons" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
